name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Covers the client, its tests, scripts and examples, then the extension.
      - run: pnpm typecheck
      # One vitest run over both projects (client + extension); all pure, no network.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:extension
      - run: test -f extension/dist/manifest.json
